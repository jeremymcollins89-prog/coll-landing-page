# Tests and deploys the website request form handler (leads-worker/) to Cloudflare Workers on the free plan.
# Runs on every push that changes it, and by hand: Actions -> Website request form -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    already set for the Academy server (needs Workers Scripts Edit)
#   CLOUDFLARE_ACCOUNT_ID   already set for the Academy server
#   RESEND_API_KEY          from resend.com -> API Keys (free plan). Until it's set, the form still works:
#                           the page opens the visitor's email app with their request filled in.
name: Website request form

on:
  push:
    branches: [main]
    paths:
      - 'leads-worker/**'
      - '.github/workflows/leads-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leads-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leads-worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leads-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check Cloudflare is set up
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Form handler not deployed::Tests passed, but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning title=No RESEND_API_KEY::Deploying, but request emails are off until you add the RESEND_API_KEY secret and run this workflow again. Meanwhile the form opens the visitor's email app instead."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set the email key
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          # Piped through stdin so the key never appears on a command line or in the log.
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi

      - name: Check it's running
        if: steps.guard.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -z "$URL" ] && URL="https://coll-leads.jeremymcollins89.workers.dev"
          body=""
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS "$URL/api/health" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then break; fi
            sleep 5
          done
          {
            echo "## Website request form handler"
            echo
            echo "**Address:** $URL"
            echo
            if printf '%s' "$body" | grep -q '"email":true'; then echo "Email: ✅ requests are emailed to you"
            elif printf '%s' "$body" | grep -q '"ok":true'; then echo "Email: ⚠️ add the RESEND_API_KEY secret, then run this workflow again"
            else echo "Health check: ⚠️ no answer yet from \`$URL/api/health\` (a new workers.dev address can take a minute)"; fi
            echo
            echo "If this address isn't https://coll-leads.jeremymcollins89.workers.dev, put it in websites.html (LEADS_API)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Form handler address::$URL"
