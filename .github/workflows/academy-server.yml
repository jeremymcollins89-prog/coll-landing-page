# Tests and deploys the Coll Ledger Academy server (academy-server/) to Cloudflare
# Workers + D1 on the free plan. Runs on every push that changes the server (or the
# app's accounting engine it grades with), and by hand: Actions -> Academy server -> Run workflow.
#
# Repository secrets (Settings -> Secrets and variables -> Actions), see academy-server/README.md:
#   CLOUDFLARE_API_TOKEN    API token with Workers Scripts Edit + D1 Edit
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID
#   CREDENTIAL_SIGNING_KEY  the same private key the Register credential workflow uses
#   ADMIN_TOKEN             a long random password for withdrawing certificates
# Until the two Cloudflare secrets exist, the tests still run and the deploy is skipped
# with a notice (the run stays green).
name: Academy server

on:
  push:
    branches: [main]
    paths:
      - 'academy-server/**'
      - 'ledger-app/src/renderer/core.js'
      - 'ledger-app/src/renderer/plus.js'
      - '.github/workflows/academy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy-server
    env:
      DB_NAME: coll-academy
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academy-server/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        env:
          # With the real key the tests also compare against scripts/credentials/sign.js and verify.js.
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
        run: npm test

      - name: Check Cloudflare is set up
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice title=Academy server not deployed::The tests passed, but nothing was deployed because these repository secrets are missing:$missing. Follow academy-server/README.md, then run this workflow again."
            {
              echo "## Academy server: not deployed yet"
              echo
              echo "The tests passed. To deploy, add these repository secrets (Settings → Secrets and variables → Actions):$missing"
              echo "Step-by-step instructions are in \`academy-server/README.md\`. Then run **Actions → Academy server → Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -z "$CREDENTIAL_SIGNING_KEY" ] && echo "::warning title=No signing key::CREDENTIAL_SIGNING_KEY isn't set, so the server can't issue certificates yet. Add it (the contents of coll-signing-key.pem) and run this workflow again."
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning title=No admin token::ADMIN_TOKEN isn't set, so certificates can't be withdrawn through the server. Add a long random password as ADMIN_TOKEN and run this workflow again."
          elif [ "${#ADMIN_TOKEN}" -lt 16 ]; then
            echo "::warning title=Admin token too short::ADMIN_TOKEN must be at least 16 characters; the server will refuse admin requests until it is."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Find or create the D1 database
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          find_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const db = list.find(x => x.name === process.argv[1]);
                process.stdout.write(db ? String(db.uuid || db.id || db.database_id || "") : "");
              });' "$DB_NAME"
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Creating the D1 database $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
            id="$(find_id)"
          else
            echo "Using the existing D1 database $DB_NAME ($id)"
          fi
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error title=D1 database::Couldn't find the id of the D1 database $DB_NAME. Check the API token has the D1 Edit permission."
            exit 1
          fi
          # The id is filled in here, at deploy time, so it never has to be committed.
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$id/" wrangler.toml
          grep -q "database_id = \"$id\"" wrangler.toml

      - name: Apply database migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy the Worker
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set the Worker's secrets
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # Piped through stdin so the values never appear on a command line or in the log.
          if [ -n "$CREDENTIAL_SIGNING_KEY" ]; then printf '%s' "$CREDENTIAL_SIGNING_KEY" | npx wrangler secret put CREDENTIAL_SIGNING_KEY; fi
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; fi

      - name: Check it's running
        if: steps.guard.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning title=Address not found::Deployed, but the workers.dev address wasn't in Wrangler's output. Find it in the Cloudflare dashboard: Workers & Pages -> coll-academy-api."
            echo "## Academy server deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Find the address in the Cloudflare dashboard: Workers & Pages → coll-academy-api." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ok=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 5
          done
          {
            echo "## Academy server deployed"
            echo
            echo "**Address:** $URL"
            echo
            if [ -n "$ok" ]; then echo "Health check: ✅ answering at \`$URL/api/health\`"; else echo "Health check: ⚠️ no answer yet from \`$URL/api/health\` — a brand-new workers.dev address can take a minute or two."; fi
            echo
            echo "Next steps (once):"
            echo "1. In \`verify.html\`, set \`var ACADEMY_API = '$URL';\` so the verify page checks certificates on the server."
            echo "2. Use the same address as the API base in the Coll Ledger app (see \`academy-server/API.md\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Academy server address::$URL"
