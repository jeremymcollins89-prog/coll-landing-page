# Registers (digitally signs) a Coll Ledger Academy credential so it shows as "Verified" on
#   https://collbusinesssolutions.com/verify.html
# By hand only: GitHub -> Actions -> Register credential -> Run workflow,
# then paste the registry entry from the student's email (the line that starts with { and ends with }).
# Pasting the whole email is fine too; the entry is picked out of it.
# To withdraw a credential, leave "entry" empty and put its ID in "revoke".
#
# Needs the repository secret CREDENTIAL_SIGNING_KEY (the private key file, coll-signing-key.pem),
# added once under Settings -> Secrets and variables -> Actions.
# It only changes credentials.json, so it doesn't start the Coll Ledger, Plan3D or Windows apps builds.
name: Register credential

on:
  workflow_dispatch:
    inputs:
      entry:
        description: 'Registry entry from the email, like {"id":"CL-2026-XXXX-XXXX","name":"…",…}'
        required: false
      revoke:
        description: 'Or, to withdraw a credential: its ID (leave the entry empty)'
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: register-credential
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the signing key is set up
        env:
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
        run: |
          if [ -z "$CREDENTIAL_SIGNING_KEY" ]; then
            echo "::error title=Signing key missing::Add the repository secret CREDENTIAL_SIGNING_KEY first: Settings -> Secrets and variables -> Actions -> New repository secret, name CREDENTIAL_SIGNING_KEY, and paste the whole contents of coll-signing-key.pem."
            exit 1
          fi

      - name: Sign the credential
        id: sign
        env:
          CREDENTIAL_SIGNING_KEY: ${{ secrets.CREDENTIAL_SIGNING_KEY }}
          ENTRY: ${{ inputs.entry }}
          REVOKE: ${{ inputs.revoke }}
        run: |
          set -e
          if [ -n "$(printf '%s' "$REVOKE" | tr -d '[:space:]')" ]; then
            node scripts/credentials/sign.js --revoke "$(printf '%s' "$REVOKE" | tr -d '[:space:]')"
          elif [ -n "$(printf '%s' "$ENTRY" | tr -d '[:space:]')" ]; then
            printf '%s' "$ENTRY" | node scripts/credentials/sign.js
          else
            echo "::error title=Nothing to do::Paste the registry entry from the email into \"entry\" (or a credential ID into \"revoke\")."
            exit 1
          fi

      - name: Check every signature
        run: node scripts/credentials/verify.js

      - name: Publish
        id: commit
        env:
          ID: ${{ steps.sign.outputs.id }}
          ACTION: ${{ steps.sign.outputs.action }}
        run: |
          set -e
          git add credentials.json
          if git diff --cached --quiet; then echo "Nothing changed."; echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ACTION" = "Revoked" ]; then MSG="Revoke credential $ID"; else MSG="Register credential $ID"; fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git push; then echo "changed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase
          done
          exit 1

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Done
        env:
          ID: ${{ steps.sign.outputs.id }}
        run: |
          echo "### ${{ steps.sign.outputs.action }} $ID" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows on https://collbusinesssolutions.com/verify.html?id=$ID within a few minutes." >> "$GITHUB_STEP_SUMMARY"
