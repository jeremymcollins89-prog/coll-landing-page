# Builds the Coll Plan3D Windows installer on GitHub's Windows computers and puts it on its own release,
# which the "Other projects" page links to:
#   https://github.com/<owner>/coll-landing-page/releases/download/plan3d/Coll-Plan3D-Setup.exe
# The release always uses the tag "plan3d" so that link never changes, and it is never marked
# "latest", so the Cleanroom Control buttons (which use releases/latest) keep pointing at their release.
# Runs by itself whenever plan3d-app/ changes and is pushed (about 5 minutes),
# or by hand: GitHub -> Actions -> Coll Plan3D -> Run workflow.
name: Coll Plan3D

on:
  push:
    branches: [main]
    paths:
      - 'plan3d-app/**'
      - '.github/workflows/plan3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plan3d-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plan3d-app/package-lock.json

      - run: npm ci

      # Built-in DWG support: GNU LibreDWG (GPLv3) dwg2dxf / dxf2dwg, shipped as separate programs.
      # The download is checked against its known SHA-256 so nothing unexpected goes into the installer.
      - name: Get LibreDWG (built-in DWG reading and saving)
        shell: pwsh
        run: |
          $ver = '0.14.8597'
          $sha = '7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2'
          $zip = Join-Path $env:RUNNER_TEMP 'libredwg.zip'
          Invoke-WebRequest "https://github.com/LibreDWG/libredwg/releases/download/$ver/libredwg-$ver-win64.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "LibreDWG download doesn't match (got $got)" }
          $x = Join-Path $env:RUNNER_TEMP 'libredwg'
          Expand-Archive $zip -DestinationPath $x -Force
          foreach ($f in 'dwg2dxf.exe', 'dxf2dwg.exe', 'libredwg-0.dll', 'libiconv-2.dll') { Copy-Item (Join-Path $x $f) libredwg/ }
          $v = & ./libredwg/dwg2dxf.exe --version 2>&1 | Out-String
          Write-Host $v
          if ($v -notmatch 'dwg2dxf') { throw 'dwg2dxf.exe did not run' }
          $global:LASTEXITCODE = 0
          Get-ChildItem libredwg

      - name: Build the installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Give the installer the name the website links to
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "dist/Coll-Plan3D-Setup-$v.exe" "dist/Coll-Plan3D-Setup.exe"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plan3d
          name: Coll Plan3D ${{ steps.ver.outputs.version }}
          body: |
            Windows installer for Coll Plan3D ${{ steps.ver.outputs.version }}, by Coll Business Solutions LLC.
            Download it from https://collbusinesssolutions.com/projects.html
          make_latest: false
          overwrite_files: true
          files: plan3d-app/dist/Coll-Plan3D-Setup.exe
