# Builds the Microsoft Store package (.appx) of Coll Plan3D, by hand only:
#   GitHub -> Actions -> Coll Plan3D for the Microsoft Store -> Run workflow
# Fill in the three values from Partner Center (your app -> Product management -> Product identity).
# The Store signs the package itself when you submit it, so no certificate is needed here.
# The finished .appx is attached to the run as "Coll-Plan3D-Store"; upload it in Partner Center -> Packages.
name: Coll Plan3D for the Microsoft Store

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity/Name (e.g. 12345CollBusinessSolutions.CollPlan3D)'
        required: true
      publisher:
        description: 'Package/Identity/Publisher (e.g. CN=1A2B3C4D-....)'
        required: true
      publisher_display_name:
        description: 'Package/Properties/PublisherDisplayName'
        required: true
        default: 'Coll Business Solutions LLC'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plan3d-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plan3d-app/package-lock.json

      - run: npm ci

      - name: Get LibreDWG (built-in DWG reading and saving)
        shell: pwsh
        run: |
          $ver = '0.14.8597'
          $sha = '7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2'
          $zip = Join-Path $env:RUNNER_TEMP 'libredwg.zip'
          Invoke-WebRequest "https://github.com/LibreDWG/libredwg/releases/download/$ver/libredwg-$ver-win64.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "LibreDWG download doesn't match (got $got)" }
          $x = Join-Path $env:RUNNER_TEMP 'libredwg'
          Expand-Archive $zip -DestinationPath $x -Force
          foreach ($f in 'dwg2dxf.exe', 'dxf2dwg.exe', 'libredwg-0.dll', 'libiconv-2.dll') { Copy-Item (Join-Path $x $f) libredwg/ }

      - name: Build the Store package
        shell: pwsh
        env:
          ID_NAME: ${{ inputs.identity_name }}
          ID_PUB: ${{ inputs.publisher }}
          ID_PUBNAME: ${{ inputs.publisher_display_name }}
        run: |
          npx electron-builder --win appx --publish never "-c.appx.identityName=$env:ID_NAME" "-c.appx.publisher=$env:ID_PUB" "-c.appx.publisherDisplayName=$env:ID_PUBNAME"
          Get-ChildItem dist/*.appx

      - uses: actions/upload-artifact@v4
        with:
          name: Coll-Plan3D-Store
          path: plan3d-app/dist/*.appx
          if-no-files-found: error
