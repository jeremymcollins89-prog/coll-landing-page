# Builds the Coll Ledger Windows installer on GitHub's Windows computers and puts it on its own release,
# which the "Other projects" page links to:
#   https://github.com/<owner>/coll-landing-page/releases/download/coll-ledger/Coll-Ledger-Setup.exe
# The release always uses the tag "coll-ledger" so that link never changes, and it is never marked
# "latest", so the Cleanroom Control buttons (which use releases/latest) keep pointing at their release.
# The app's built-in updater reads latest.yml from this same release.
# Runs by itself whenever ledger-app/ changes and is pushed (about 5 minutes),
# or by hand: GitHub -> Actions -> Coll Ledger -> Run workflow.
name: Coll Ledger

on:
  push:
    branches: [main]
    paths:
      - 'ledger-app/**'
      - '.github/workflows/coll-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ledger-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ledger-app/package-lock.json

      - run: npm ci

      - name: Check the accounting engine
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Get-Content dist/latest.yml
          if (-not (Select-String -Path dist/latest.yml -Pattern "version: $v" -Quiet)) { throw 'latest.yml has the wrong version' }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coll-ledger
          name: Coll Ledger ${{ steps.ver.outputs.version }}
          body: |
            Windows installer for Coll Ledger ${{ steps.ver.outputs.version }}, by Coll Business Solutions LLC.
            Download it from https://collbusinesssolutions.com/projects.html
          make_latest: false
          overwrite_files: true
          files: |
            ledger-app/dist/Coll-Ledger-Setup.exe
            ledger-app/dist/Coll-Ledger-Setup.exe.blockmap
            ledger-app/dist/latest.yml
