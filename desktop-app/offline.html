<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
  <title>Cleanroom Control</title>
  <style>
    :root { --bg: #f3f5f8; --card: #fff; --ink: #0f172a; --muted: #5b6b82; --brand: #0e7490; --line: #e2e8f0; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a111e; --card: #111b2c; --ink: #e6edf6; --muted: #93a3ba; --brand: #22b8d4; --line: #22304a; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; max-width: 420px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 14px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 10px 18px; background: var(--brand); color: #fff; cursor: pointer; }
    small { display: block; margin-top: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0e7490"/><rect x="6.4" y="6.4" width="19.2" height="4.5" rx="1" fill="#fff"/><g fill="#fff"><rect x="8.7" y="14.4" width="1.8" height="8" rx=".9"/><rect x="15.1" y="14.4" width="1.8" height="8" rx=".9"/><rect x="21.5" y="14.4" width="1.8" height="8" rx=".9"/><path d="M7.5 21.6h4.2L9.6 25.6z M13.9 21.6h4.2L16 25.6z M20.3 21.6h4.2L22.4 25.6z"/></g></svg>
    <h1>Can't reach Cleanroom Cloud</h1>
    <p>Check this computer's internet connection. Your rooms keep running on their own.</p>
    <button id="retry" type="button">Try again</button>
    <small id="note">Trying again automatically every 10 seconds.</small>
  </div>
  <script>
    const server = new URLSearchParams(location.search).get('server');
    const go = () => { if (server) location.href = server; };
    document.getElementById('retry').addEventListener('click', go);
    setInterval(go, 10000);
  </script>
</body>
</html>
